<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Code Bloom - Contact</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link rel="stylesheet" href="style.css">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <link rel="icon" type="image/png" href="logo.png">
        </head>

<!-- Hide header search on informational pages -->
<body class="no-search">
    
<!-- Shared header (edit it in header.js) -->
<div id="site-header"></div>

<section class="contact">

    <div class="contact-box">

        <!-- LEFT -->
        <div class="contact-left">
            <span class="eyebrow">CONTACT</span>
            <h2>Let's Connect</h2>
            <p>Questions, ideas or feedback?
            We'd love to hear from you.</p>

            <div class="email-card">
                <div>
                    <h4><i class="ti ti-mail"></i> Email</h4>
                    <p>hello@codebloom.dev</p>
                </div>
            </div>

            <div class="social-links">
                <a href="#" target="_blank"><i class="ti ti-brand-github"></i> GitHub</a>
                <a href="#" target="_blank"><i class="ti ti-brand-instagram"></i> Instagram</a>
                <a href="#" target="_blank"><i class="ti ti-brand-x"></i></a>
            </div>
        </div>

<!-- RIGHT -->
        <div class="contact-right">
            <form class="contact-form" id="contact-form">

    <div class="input-row">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
    </div>

    <input type="text" name="subject" placeholder="Subject" required>

    <input type="text" name="website" tabindex="-1" autocomplete="off">

    <textarea
        name="message"
        placeholder="Tell us about your question, idea, or feedback..."
        rows="6"
        required></textarea>

    <button type="submit">
        Send Message →
    </button>

</form>
    </div>
</div>
</section>

    <!-- Shared footer (edit it in footer.js) -->
<div id="site-footer"></div>

<!-- Shared site scripts -->
<script src="footer.js"></script>
<script src="header.js"></script>
<script src="auth.js"></script>

</body>
</html>
