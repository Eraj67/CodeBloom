<!DOCTYPE html>
<html lang="en">
<head>
    <title>Log In / Sign Up - Code Bloom</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="icon" type="image/png" href="../logo.png">
</head>

<!-- Hide header search on informational pages -->
<body class="no-search">

<!-- Shared header (edit it in header.js) -->
<div id="site-header"></div>

<div class="auth-wrap">
    <div class="auth-card" id="auth-card">

        <div class="auth-form-side" id="login-form-side">
            <h2>Log In</h2>
            <form id="login-form">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <p class="auth-switch-text">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
        </div>

        <div class="auth-form-side" id="signup-form-side">
            <h2>Create Account</h2>
            <form id="signup-form">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                <input type="text" name="website" tabindex="-1" autocomplete="off">

                <button type="submit">Sign Up</button>
            </form>
            <p class="auth-switch-text">Already have an account? <a href="#" id="show-login">Log in</a></p>
        </div>

        <div class="auth-panel" id="auth-panel">
            <h3 id="panel-title">Welcome Back!</h3>
            <p id="panel-text">Log in to keep learning where you left off.</p>
            <button id="panel-btn">Sign Up</button>
        </div>

    </div>
</div>

        <!-- Shared site scripts -->
        <script src="../header.js"></script>
        <script src="../footer.js"></script>
        <script src="../auth.js"></script>

        <script src="auth-toggle.js"></script>
        <script src="authform.js"></script>
        
    </body>
</html>
