<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body>

<header class="site-header">
    <a class="logo" href="index.html">
        <img src="logo.png" alt="CodeBloom Logo" class="logo-img">
        <span class="code">Code</span><span class="bloom">Bloom</span>
    </a>

    <nav class="navbar">
        <a href="index.html">HOME</a>
        <a href="courses.html" class="active">COURSES</a>
        <a href="project.html">PROJECT</a>
        <a href="challenge.html">CHALLENGE</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</header>

<section class="about-hero">
    <p class="eyebrow" id="lesson-course">LESSON</p>
    <h1 class="about-title" id="lesson-title">Loading...</h1>
    <p class="section-description" id="lesson-description"></p>
    <p style="color: #666; font-size: 14px; margin-top: 12px;" id="lesson-duration"></p>
</section>

<section class="section">
    <div class="lesson-content" id="lesson-content">
    </div>

    <div class="lesson-navigation" style="display: flex; justify-content: space-between; margin-top: 40px; padding-top: 30px; border-top: 1px solid #222;">
        <a href="#" id="prev-lesson" style="text-decoration: none; color: #f6d88f;">
            <i class="ti ti-arrow-left"></i> Previous Lesson
        </a>
        
        <a href="#" id="next-lesson" style="text-decoration: none; color: #f6d88f;">
            Next Lesson <i class="ti ti-arrow-right"></i>
        </a>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <button id="complete-lesson-btn" style="background: #f6d88f; color: #111; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;">
            <i class="ti ti-check"></i> Mark as Complete
        </button>
    </div>
</section>

<!-- Shared footer (edit it in footer.js) -->
<div id="site-footer"></div>
<script src="footer.js"></script>

<script src="auth.js"></script>
<script src="lesson.js"></script>
</body>
</html>
